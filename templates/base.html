<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PumaRide{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Leaflet CSS (Para tus futuros mapas en la ENES) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
         :root {
            --azul-unam: #003b5c;
            --oro-unam: #f1c40f;
        }
        
        body {
            background-color: #f0f2f5;
            min-height: 100vh;
        }
        
        .navbar-puma {
            background-color: var(--azul-unam);
            border-bottom: 3px solid var(--oro-unam);
        }
        
        .btn-puma-oro {
            background-color: var(--oro-unam);
            color: var(--azul-unam);
            border: none;
            font-weight: bold;
        }
        
        .btn-puma-oro:hover {
            background-color: #d4ac0d;
            color: var(--azul-unam);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>

    <nav class="navbar navbar-dark navbar-puma shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-car-front-fill me-2"></i>PumaRide
            </a>
            <span class="navbar-text text-white d-none d-md-inline">
                ENES Morelia
            </span>
        </div>
    </nav>

    <main>
        {% block content %}
        <!-- Aquí se inyectará passenger_profile.html -->
        {% endblock %}
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
