<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<style>
    body {
        background-color: #f0f2f5;
    }
</style>

{% extends 'base.html' %} {% block title %} Inicio - PumaRide {% endblock %} {% block content %}
<div class="container py-5">
    <div class="row mb-5 text-center">
        <div class="col-12">
            <h1 class="display-5 fw-bold" style="color: #003b5c;">Welcome to PumaRide!</h1>
            <p class="lead text-muted">A community focused ride service.</p>
            <div class="mx-auto" style="width: 60px; height: 4px; background-color: #f1c40f; border-radius: 2px;"></div>
        </div>
    </div>

    <div class="row g-4 justify-content-center mb-4">

        <div class="col-md-5">
            <div class="card h-100 border-0 shadow-sm text-center p-4">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3 d-inline-block mb-3" style="color: #003b5c !important;">
                            <i class="bi bi-person-walking display-4"></i>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <a href="{% url 'passenger_profile' %}" class="btn btn-warning fw-bold py-2 shadow-sm" style="background-color: #f1c40f; border: none; color: #003b5c;">
                            Passenger profile
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card h-100 border-0 shadow-sm text-center p-4">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <div class="bg-dark bg-opacity-10 text-dark rounded-circle p-3 d-inline-block mb-3" style="width: 80px; height: 80px; display: inline-flex; align-items: center; justify-content: center;">
                            <i class="bi bi-car-front-fill display-4 text-dark"></i>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <a href="{% url 'driver_profile' %}" class="btn btn-dark py-2 fw-bold shadow-sm">
                            <i class="bi bi-person-badge me-2"></i>Driver profile
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card border-0 shadow-sm overflow-hidden" style="background: linear-gradient(135deg, #003b5c 0%, #00253a 100%); color: white;">
                <div class="row g-0 align-items-center">
                    <div class="col-sm-8 p-4 shadow-sm">
                        <div class="d-flex align-items-center mb-2">
                            <i class="bi bi-map-fill text-warning fs-3 me-3"></i>
                            <h4 class="card-title fw-bold mb-0">Rides Map</h4>
                        </div>
                        <p class="card-text text-white-50 small mb-0">
                            Calculate the most efficient route to your destination.
                        </p>
                    </div>
                    <div class="col-sm-4 p-4 text-center text-sm-end">
                        <a href="{% url 'index' %}" class="btn btn-light fw-bold text-primary px-4 py-2 shadow-sm" style="color: #003b5c !important;">
                            <i class="bi bi-geo-alt-fill me-2"></i>See Map
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>


</div>
{% endblock %}
